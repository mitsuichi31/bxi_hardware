# 1軸の実機試験（ベンチ）用。モーターは PCAN の can0 に直接接続し、can_id 1 とする。
# 事前にホストで can0 を 1 Mbps（CAN FD を使うなら fd on、データ 5 Mbps）で up しておくこと。
active_can_buses: [can0]
# classic / fd / fd_brs。fd / fd_brs は can0 が fd on のときだけ使える。
can_frame_format:
  can0: classic
defaults:
  control_timeout_ms: 3
  maximum_consecutive_timeouts: 3
  can_hz: 200
  temperature_sensor_fault_below_c: -20.0
joints:
  joint1:
    enabled: true
    can_bus: can0
    can_id: 1
    motor_dir: 1
    motor_type: MOTOR_70
    # ベンチ試験用の狭い範囲 [rad]（出力軸、ユーザーゼロ点基準）
    lower: -0.5
    upper: 0.5
    # position だけを指令し、kp / kd を指令しなかったときに使う値
    default_kp: 10.0
    default_kd: 2.0
